# Étagère server. Start: `docker compose -f docker/docker-compose.yml up -d`
# (or copy this file anywhere and run `docker compose up -d` next to it).
# Then open http://<this computer's address>:4848 on a phone of the household.
services:
  etagere:
    image: ghcr.io/bibear/etagere:latest
    container_name: etagere
    restart: unless-stopped
    init: true
    environment:
      ETAGERE_HOUSEHOLD_NAME: 'Étagère'
      # Inside a container the server only sees its own address (172.x): set this computer's
      # address so the start-up QR code and the app show a URL phones can reach.
      # ETAGERE_PUBLIC_URL: 'http://192.168.1.20:4848'
    volumes:
      # The library: SQLite database and covers (back it up, see the README).
      # To use a folder instead: `- ./data:/data` after `sudo chown 1000:1000 ./data`
      # (the server runs as the unprivileged `node` user, uid 1000).
      - etagere-data:/data
    ports:
      - '4848:4848'
    # Linux only: share the host network so the app finds the server as etagere.local (mDNS)
    # and the start-up banner shows the real LAN addresses. Remove `ports` when enabled.
    # network_mode: host

volumes:
  etagere-data:
