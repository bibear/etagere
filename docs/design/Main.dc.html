<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bibliothèque</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B4A}a:hover{color:#154D35}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F4F1; font-family: Inter, system-ui, sans-serif; color: #16201B; display: flex; flex-direction: column; overflow: hidden">
<div style="flex: 1; min-height: 0; overflow: hidden; padding: 48px 20px 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.5px">La bibliothèque</h1>
<p style="margin: 0; font-size: 14px; color: #5B6660">128 livres à la maison · 9 en lecture</p>
</div>
<button aria-label="Mon profil : Bruno" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #1F6B4A; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 16px; font-weight: 600">B</button>
</div>
<label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; background: #FFFFFF; border: 1px solid #DDE1DC; border-radius: 12px; box-sizing: border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6660" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input type="search" placeholder="Titre, auteur, ISBN…" aria-label="Rechercher un livre" style="flex: 1; border: none; background: transparent; font-family: Inter, sans-serif; font-size: 15px; color: #16201B; outline: none">
</label>
<div style="display: flex; gap: 8px; overflow: hidden">
<button style="flex: none; height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: #16201B; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 14px; font-weight: 500">Tous · 128</button>
<button style="flex: none; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #DDE1DC; background: #FFFFFF; color: #16201B; font-family: Inter, sans-serif; font-size: 14px; font-weight: 500">Disponibles · 119</button>
<button style="flex: none; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #DDE1DC; background: #FFFFFF; color: #16201B; font-family: Inter, sans-serif; font-size: 14px; font-weight: 500">En lecture · 9</button>
<button style="flex: none; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #DDE1DC; background: #FFFFFF; color: #16201B; font-family: Inter, sans-serif; font-size: 14px; font-weight: 500">Non lus par moi</button>
</div>
<div style="display: flex; align-items: baseline; justify-content: space-between; padding-top: 4px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 700">Ajoutés récemment</h2>
<a href="#" style="font-size: 14px; font-weight: 500">Tout voir</a>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 12px">
<sc-for list="{{books}}" as="b" hint-placeholder-count="6">
<a href="Livre.dc.html" style="display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: #16201B">
<div style="{{b.coverStyle}}"><span style="font-weight: 700; font-size: 13px; line-height: 1.15">{{b.title}}</span><span style="font-size: 10px; opacity: 0.85">{{b.author}}</span></div>
<span style="font-size: 13px; font-weight: 600; line-height: 1.25">{{b.title}}</span>
<span style="font-size: 12px; color: #5B6660; line-height: 1.25">{{b.author}}</span>
<span style="{{b.badgeStyle}}">{{b.status}}</span>
</a>
</sc-for>
</div>
</div>
<nav aria-label="Navigation principale" style="display: flex; background: #FFFFFF; border-top: 1px solid #DDE1DC; padding: 6px 8px 22px">
<a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; text-decoration: none; color: #1F6B4A; font-size: 12px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path></svg>Biblio</a>
<a href="Lectures.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; text-decoration: none; color: #5B6660; font-size: 12px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10v18l-5-4-5 4z"></path></svg>Lectures</a>
<a href="Scan.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; text-decoration: none; color: #5B6660; font-size: 12px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5h4M16 5h4v3M20 16v3h-4M8 19H4v-3"></path><path d="M8 9v6M11 9v6M14 9v6M17 9v6"></path></svg>Scanner</a>
<a href="Recos.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; text-decoration: none; color: #5B6660; font-size: 12px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>Pour toi</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var cover = function (bg, fg) {
return 'height: 136px; border-radius: 6px; box-sizing: border-box; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; font-family: Bricolage Grotesque, sans-serif; background: ' + bg + '; color: ' + fg;
};
var badge = function (reading) {
return 'align-self: flex-start; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 10px; ' + (reading ? 'background: #FCE9C2; color: #6E4300' : 'background: #DCEFE4; color: #155238');
};
var raw = [
['Dune', 'Frank Herbert', '#B5523B', '#FFFFFF', false, 'Disponible'],
['La Horde du Contrevent', 'Alain Damasio', '#2C4A6B', '#FFFFFF', true, 'Jules lit'],
['Le Petit Prince', 'Saint-Exupéry', '#E3B448', '#2A1E00', false, 'Disponible'],
['Sapiens', 'Yuval Noah Harari', '#1E2A33', '#FFFFFF', false, 'Disponible'],
['Le Problème à trois corps', 'Liu Cixin', '#6B4E8A', '#FFFFFF', true, 'Inès lit'],
['L’Étranger', 'Albert Camus', '#3E6B4F', '#FFFFFF', false, 'Disponible']
];
return {
books: raw.map(function (r) {
return { title: r[0], author: r[1], coverStyle: cover(r[2], r[3]), status: r[5], badgeStyle: badge(r[4]) };
})
};
}
}
</script>
</body>
</html>
